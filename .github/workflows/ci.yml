name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Policy is valid
        run: python -m vito policy --json > /dev/null

      - name: No secrets committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked"
            exit 1
          fi

      - name: Every package is tracked
        run: |
          fail=0
          while read -r f; do
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 || {
              echo "::error::$f exists but is not tracked (gitignore too broad?)"
              fail=1
            }
          done < <(find src/vito -name '__init__.py')
          exit $fail
