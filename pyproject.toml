[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vito"
version = "0.1.0"
description = "A personal quantitative treasury system for Binance (and OKX): cross-asset momentum, Simple Earn cash yield, an enforced risk constitution, and guarded execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "triloger" }]
keywords = ["quant", "trading", "binance", "okx", "risk-management", "crypto", "tradfi", "backtesting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "ccxt>=4.4",
  "pandas>=2.0",
  "numpy>=1.26",
  "rich>=13.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vito = "vito.cli:main"

[project.urls]
Homepage = "https://github.com/triloger/vito"
Documentation = "https://github.com/triloger/vito/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
